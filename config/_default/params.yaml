# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance
appearance:
  mode: system
  color: cyan

# SEO
marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: 'Likun Wang'
    description: 'Likun Wang (王立坤) — Algorithm Engineer working on TPU operators, deep learning, and bio-inspired topology optimization. M.Eng. from Waseda University. WCSMO-16 oral presenter.'
    twitter: ''
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    plausible: ''
    fathom: ''
    pirsch: ''
  verification:
    google: ''
    baidu: ''

# Site header
header:
  navbar:
    enable: true
    blox: "navbar"
    fixed_to_top: true
    show_search: true
    show_theme_chooser: true
    # The custom translate button replaces the stock language chooser.
    show_translations: false
    logo:
      text: "Likun Wang"

# Site footer
footer:
  show_translations: false
  text: '[Sitemap](/sitemap.xml) · [GitHub](https://github.com/LikunWang-Vector/LikunWang-Vector.github.io) · [Back to top ↑](#top)'
  copyright:
    notice: '© {year} Likun Wang (王立坤) · Algorithm Engineer'
    license:
      enable: false
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

# Localization
locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'

# Site features
features:
  math:
    enable: true
  privacy_pack:
    enable: false
  comment:
    provider: ''
  # Page language bar.
  # Native English/Chinese pages are the primary experience.
  # Other languages use the Google Translate Element to translate the current
  # page in place (no redirect). Google is loaded only after a language click.
  translation:
    enable: true
    native: true
    google:
      # Google Translate language codes; native EN/ZH links are added automatically.
      languages:
        - ja
        - ko
        - zh-Hant
        - fr
        - de
        - es
        - ru
        - pt

publications:
  citation_style: apa
