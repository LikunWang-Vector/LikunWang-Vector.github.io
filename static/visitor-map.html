<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Visitor map</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: radial-gradient(70% 90% at 50% 40%, #0b2630 0%, #071319 70%);
      color: #cfe3ea;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    main { width: 100%; padding: 1rem; text-align: center; }
    #map { min-height: 200px; display: flex; align-items: center; justify-content: center; }
    p { margin: 0.75rem 0 0; color: #7f9aa8; font-size: 0.72rem; }
    a { color: #67e8f9; }
  </style>
</head>
<body>
  <main>
    <div id="map">
      <script type="text/javascript" src="https://rf.revolvermaps.com/0/0/8.js?i=5fy4z8xv8ew&amp;m=0&amp;c=ff0000&amp;cr1=ffffff&amp;f=arial&amp;l=33" async="async"></script>
    </div>
    <noscript><p>This visitor map requires JavaScript.</p></noscript>
    <p>Visitor map by <a href="https://www.revolvermaps.com/" target="_blank" rel="noopener">RevolverMaps</a></p>
  </main>
</body>
</html>
